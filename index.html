<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="习概刷题">
<meta name="theme-color" content="#b91c1c">
<title>习概选择题乱序自测</title>
<style>
:root {
  --bg:#f8fafc; --card:#ffffff; --text:#111827; --muted:#6b7280; --line:#e5e7eb;
  --red:#b91c1c; --red2:#991b1b; --green:#15803d; --orange:#c2410c;
  --shadow:0 10px 30px rgba(15,23,42,.08); --radius:18px;
}
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Arial,sans-serif; background:var(--bg); color:var(--text); }
.app { max-width:760px; margin:0 auto; padding:calc(14px + env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom)); }
.top { position:sticky; top:0; z-index:5; margin:0 -14px 14px; padding:calc(10px + env(safe-area-inset-top)) 14px 10px; background:rgba(248,250,252,.92); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
.title { font-size:22px; font-weight:800; letter-spacing:-.3px; display:flex; justify-content:space-between; gap:10px; align-items:center; }
.subtitle { margin-top:5px; color:var(--muted); font-size:13px; line-height:1.45; }
.card { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px; margin:12px 0; }
.section-title { font-size:17px; font-weight:750; margin-bottom:12px; }
.row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.btn { appearance:none; border:0; border-radius:14px; padding:12px 14px; font-size:16px; font-weight:700; background:#e5e7eb; color:#111827; min-height:46px; cursor:pointer; }
.btn.primary { background:var(--red); color:white; }
.btn.primary:active { background:var(--red2); }
.btn.ghost { background:#f3f4f6; color:#374151; }
.btn.full { width:100%; }
.btn.small { min-height:38px; padding:9px 11px; font-size:14px; }
.input { width:120px; border:1px solid var(--line); border-radius:13px; padding:11px 12px; font-size:16px; background:white; }
.chapter-list { display:grid; gap:8px; max-height:48vh; overflow:auto; padding-right:2px; }
.check-row { display:flex; align-items:flex-start; gap:10px; padding:11px; border:1px solid var(--line); border-radius:14px; background:#fff; line-height:1.35; }
.check-row input { transform:scale(1.25); margin-top:3px; }
.tag { display:inline-block; padding:3px 8px; border-radius:999px; background:#fee2e2; color:#991b1b; font-size:12px; font-weight:700; margin-left:6px; }
.tag.gray { background:#f3f4f6; color:#4b5563; }
.qmeta { color:#6b7280; font-size:13px; line-height:1.45; }
.progress { height:8px; background:#e5e7eb; border-radius:999px; overflow:hidden; margin:10px 0 0; }
.bar { height:100%; width:0%; background:var(--red); transition:width .2s ease; }
.stem { font-size:17px; font-weight:650; line-height:1.65; white-space:pre-wrap; }
.options { display:grid; gap:10px; margin-top:14px; }
.option { display:flex; gap:10px; align-items:flex-start; padding:14px; border:1.5px solid var(--line); border-radius:16px; background:#fff; font-size:16px; line-height:1.55; }
.option input { transform:scale(1.25); margin-top:5px; flex:0 0 auto; }
.option.selected { border-color:#b91c1c; background:#fff7f7; }
.feedback { padding:12px 14px; border-radius:14px; background:#f3f4f6; color:#374151; line-height:1.55; font-size:15px; }
.feedback.good { background:#dcfce7; color:#166534; }
.feedback.bad { background:#fee2e2; color:#991b1b; }
.feedback.warn { background:#ffedd5; color:#9a3412; }
.result-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.stat { padding:13px; border-radius:15px; background:#f9fafb; border:1px solid var(--line); }
.stat b { display:block; font-size:22px; margin-top:4px; }
.review { white-space:pre-wrap; line-height:1.55; font-size:14px; background:#f9fafb; border-radius:14px; padding:12px; max-height:45vh; overflow:auto; }
.hidden { display:none !important; }
.footer-space { height:10px; }
@media (max-width:420px) {
  .app { padding-left:12px; padding-right:12px; }
  .title { font-size:20px; }
  .card { padding:14px; border-radius:16px; }
  .btn { font-size:15px; padding:11px 12px; }
  .stem { font-size:16px; }
  .result-grid { grid-template-columns:1fr; }
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="title"><span>习概乱序自测</span><button class="btn small ghost" id="homeBtn">首页</button></div>
    <div class="subtitle" id="topNote">导论有答案可判分，其他章节先自测不判分。</div>
  </div>

  <main id="startView">
    <div class="card">
      <div class="section-title">选择章节</div>
      <div class="row" style="margin-bottom:10px">
        <button class="btn small ghost" id="selectAllBtn">全选</button>
        <button class="btn small ghost" id="clearBtn">清空</button>
        <button class="btn small ghost" id="introBtn">只练导论</button>
      </div>
      <div class="chapter-list" id="chapterList"></div>
    </div>
    <div class="card">
      <div class="section-title">本轮设置</div>
      <div class="row" style="margin-bottom:12px">
        <label>抽题数：</label>
        <input class="input" id="limitInput" value="全部" inputmode="numeric" placeholder="全部/20">
        <span class="subtitle">填“全部”或数字</span>
      </div>
      <label class="check-row"><input type="checkbox" id="shuffleQ" checked><span>打乱题目顺序</span></label>
      <label class="check-row"><input type="checkbox" id="shuffleO"><span>打乱选项顺序</span></label>
      <button class="btn primary full" id="startBtn" style="margin-top:14px">开始自测</button>
    </div>
  </main>

  <main id="quizView" class="hidden">
    <div class="card">
      <div class="qmeta" id="qMeta"></div>
      <div class="progress"><div class="bar" id="bar"></div></div>
      <div class="stem" id="stem" style="margin-top:14px"></div>
      <div class="options" id="options"></div>
    </div>
    <div class="card">
      <div class="feedback" id="feedback">选择答案后点击提交；多选题可选择多个。</div>
      <div class="row" style="margin-top:12px; justify-content:flex-end">
        <button class="btn ghost" id="skipBtn">跳过</button>
        <button class="btn primary" id="submitBtn">提交答案</button>
        <button class="btn ghost" id="finishBtn">结束</button>
      </div>
    </div>
  </main>

  <main id="resultView" class="hidden">
    <div class="card">
      <div class="section-title">本轮结果</div>
      <div class="result-grid" id="resultStats"></div>
    </div>
    <div class="card">
      <div class="section-title">错题 / 跳过题回顾</div>
      <div class="review" id="reviewText"></div>
    </div>
    <button class="btn primary full" id="againBtn">再来一轮</button>
  </main>
  <div class="footer-space"></div>
</div>

<script>
const QUESTIONS = [{"chapter":"导论选择题","number":1,"type":"多选题","stem":"以习近平同志为主要代表的中国共产党人,坚持把马克思主义基本原理同中国具体实际相结合.同中华优秀传统文化相结合,坚特毛泽东思想.邓小平理论.\"三个代表\"重要思想.科学发展观,深刻总结并充分运用党成立以来的历史经验,从新的实际出发,创立了习近平新时代中国特色社会主义思想.习近平新时代中国特色社会主义思想（ ）.","options":[{"key":"A","text":"实现了马克思主义中国化时代化新的飞跃"},{"key":"B","text":"是当代中国马克思主义"},{"key":"C","text":"是21世纪马克思主义"},{"key":"D","text":"中华文化和中国精神的时代精华"}],"answer":["A","B","C","D"]},{"chapter":"导论选择题","number":2,"type":"多选题","stem":"中国共产党的历史就是一部不断推进理论创新.进行理论创造的历史.不断谱写马克思主义中国化时代化新篇章,是当代中国共产党人的庄严历史责任.继续推进实践基础上的理论创新,首先要把握好新时代中国特色社会主义思想的世界观和方法论,坚持好.运用好贯穿其中的立场观点方法.必须（ ）.","options":[{"key":"A","text":"坚持系统观念,坚持胸怀天下"},{"key":"B","text":"坚持守正创新,坚持问题导向"},{"key":"C","text":"坚持党的领导,坚持实事求是"},{"key":"D","text":"坚持人民至上,坚持自信自立"}],"answer":["A","B","D"]},{"chapter":"导论选择题","number":3,"type":"多选题","stem":"习近平新时代中国特色社会主义思想科学回答的重大时代课题是（ ）.","options":[{"key":"A","text":"建设什么样的社会主义现代化强国.怎样建设社会主义现代化强国"},{"key":"B","text":"坚持和发展什么样的中国特色社会主义.怎样坚持和发展中国特色社会主义"},{"key":"C","text":"建设什么样的长期执政的马克思主义政党.怎样建设长期执政的马克思主义政党"},{"key":"D","text":"实现什么样的发展.怎样发展"}],"answer":["A","B","C"]},{"chapter":"导论选择题","number":4,"type":"多选题","stem":"习近平新时代中国特色社会主义思想是当代中国马克思主义.21世纪马克思主义,是中华文化和中国精神的时代精华,实现了马克思主义中国化时代化新的飞跃.习近平新时代中国特色社会主义思想创立的社会历史条件是（ ）.","options":[{"key":"A","text":"世界正经历百年未有之大变局"},{"key":"B","text":"中国全面建成了小康社会"},{"key":"C","text":"中华民族伟大复兴正处于关键时期"},{"key":"D","text":"中国特色社会主义进入新时代"}],"answer":["A","C","D"]},{"chapter":"导论选择题","number":5,"type":"单选题","stem":"习近平新时代中国特色社会主义思想内涵十分丰富,其主要内容就是党的十九大.十九届六中全会提出的\"十个明确\"\"十四个坚持\"\"十三个方面成就\".习近平新时代中国特色社会主义思想明确中国特色社会主义最本质的特征是（ ）.","options":[{"key":"A","text":"中国共产党领导"},{"key":"B","text":"坚持社会主义核心价值体系"},{"key":"C","text":"人民当家作主"},{"key":"D","text":"以人民为中心"}],"answer":["A"]},{"chapter":"导论选择题","number":6,"type":"单选题","stem":"实现社会主义现代化和中华民族伟大复兴,是坚持和发展中国特色社会主义的（ ）.","options":[{"key":"A","text":"总任务"},{"key":"B","text":"总依据"},{"key":"C","text":"总路线"},{"key":"D","text":"总布局"}],"answer":["A"]},{"chapter":"导论选择题","number":7,"type":"多选题","ste  )是实现中华民族伟大复兴的根本保证.","options":[{"key":"A","text":"中国共产党"},{"key":"B","text":"社会和谐"},{"key":"C","text":"中国人民主体地位"},{"key":"D","text":"中华民族团结"}],"answer":null},{"chapter":"一、第一章选择题","number":8,"type":"多选题","stem":"8、(多选题)坚持把马克思主义基本原理同( )相结合,用马克思主义观察时代.把握时代.引领时代,继续发展当代中国马克思主义.21世纪马克思主义.","options":[{"key":"A","text":"中国精神"},{"key":"B","text":"中华优秀传统文化"},{"key":"C","text":"中国具体实际相结合"},{"key":"D","text":"民族特色"}],"answer":null},{"chapter":"一、第一章选择题","number":9,"type":"单选题","stem":"9、(单选题)党的十八大以来,我们党的全部理论和实践探索都是围绕( )这个主题来展开.深化和拓展的.","options":[{"key":"A","text":"坚持和发展中国特色社会主义"},{"key":"B","text":"实现什么样发展,怎样发展"},{"key":"C","text":"建设一个什么样的党,怎样建设党"},{"key":"D","text":"什么是社会主义,怎样建设社会主义"}],"answer":null},{"chapter":"一、第一章选择题","number":10,"type":"多选题","stem":"10、(多选题)习近平新时代中国特色社会主义思想是当代中国马克思主义.二十一世纪马克思主义,是( )的时代精华,实现了马克思主义中国化新的飞跃.","options":[{"key":"A","text":"中华文化"},{"key":"B","text":"中华品格"},{"key":"C","text":"中国力量"},{"key":"D","text":"中国精神"}],"answer":null},{"chapter":"一、第一章选择题","number":11,"type":"多选题","stem":"11、(多选题)建设一支( ),的人民军队,是实现\"两个一百年\"奋斗目标.实现中华民族伟大复兴的战略支撑.","options":[{"key":"A","text":"能打胜仗"},{"key":"B","text":"作风优良"},{"key":"C","text":"全心全意为人民服务"},{"key":"D","text":"听党指挥"}],"answer":null},{"chapter":"一、第一章选择题","number":12,"type":"多选题","stem":"12、(多选题)发展是解决我国一切问题的基础和关键,发展必须是科学发展,必须坚定不移贯彻创新( )的发展理念.","options":[{"key":"A","text":"绿色"},{"key":"B","text":"共享"},{"key":"C","text":"协调"},{"key":"D","text":"开放"}],"answer":null},{"chapter":"一、第一章选择题","number":13,"type":"多选题","stem":"13、(多选题)我国社会主要矛盾的变化( ).","options":[{"key":"A","text":"我国是世界最大发展中国家的国际地位没有变"},{"key":"B","text":"没有改变我们对我国社会主义所处历史阶段的判断"},{"key":"C","text":"以上都正确"},{"key":"D","text":"我国仍处于并将长期处于社会主义初级阶段的基本国情没有变"}],"answer":null},{"chapter":"一、第一章选择题","number":14,"type":"多选题","stem":"14、(多选题)中国特色社会主义事业总体布局是\"五位一体\".战略布局是\"四个全面\",强调坚定( ).","options":[{"key":"A","text":"文化自信"},{"key":"B","text":"制度自信"},{"key":"C","text":"理论自信"},{"key":"D","text":"道路自信"}],"answer":null},{"chapter":"一、第一章选择题","number":15,"type":" let chapters = [];
let state = { pool:[], idx:0, shuffleOptions:false, current:null, displayOptions:[], displayAnswer:null, answered:false,
  totalKnown:0, answeredKnown:0, correct:0, skippedKnown:0, noAnswerAnswered:0, noAnswerSkipped:0, wrongRecords:[] };

const $ = (id) => document.getElementById(id);
function shuffle(arr) { for(let i=arr.length-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }
function show(view) { ['startView','quizView','resultView'].forEach(id=>$(id).classList.toggle('hidden', id!==view)); window.scrollTo({top:0,behavior:'smooth'}); }
function uniqueChapters() { const seen=new Set(); const list=[]; QUESTIONS.forEach(q=>{ if(!seen.has(q.chapter)){seen.add(q.chapter);list.push(q.chapter);} }); return list; }
function stats(ch) { const total=QUESTIONS.filter(q=>q.chapter===ch).length; const ans=QUESTIONS.filter(q=>q.chapter===ch && q.answer).length; return {total,ans}; }
function renderChapters() {
  chapters = uniqueChapters(); const box=$('chapterList'); box.innerHTML='';
  chapters.forEach((ch,i)=>{ const s=stats(ch); const label=document.createElement('label'); label.className='check-row';
    label.innerHTML=`<input type="checkbox" class="chBox" data-index="${i}" checked><span>${ch}（${s.total}题）<span class="tag ${s.ans?'':'gray'}">${s.ans?'可判分':'无答案'}</span></span>`;
    box.appendChild(label);
  });
}
function selectedChapters() { return [...document.querySelectorAll('.chBox:checked')].map(el=>chapters[Number(el.dataset.index)]); }
function resetStats() { state.totalKnown=0; state.answeredKnown=0; state.correct=0; state.skippedKnown=0; state.noAnswerAnswered=0; state.noAnswerSkipped=0; state.wrongRecords=[]; }
function startQuiz() {
  const selected=selectedChapters(); if(!selected.length) { alert('请至少选择一个章节'); return; }
  let pool=QUESTIONS.filter(q=>selected.includes(q.chapter)); if($('shuffleQ').checked) shuffle(pool);
  const raw=$('limitInput').value.trim();
  if(raw && raw!=='全部' && raw.toLowerCase()!=='all') { const n=parseInt(raw,10); if(!n || n<1) { alert('抽题数请填正整数，或填“全部”。'); return; } pool=pool.slice(0, Math.min(n,pool.length)); }
  state.pool=pool; state.idx=0; state.shuffleOptions=$('shuffleO').checked; resetStats(); renderQuestion(); show('quizView');
}
function buildDisplay(q) {
  let opts=q.options.map(o=>[o.key,o.text]); if(state.shuffleOptions) shuffle(opts);
  const letters='ABCDEF'.split(''); const map={}; const display=[];
  opts.forEach(([orig,text],i)=>{ const dk=letters[i]; display.push([dk,orig,text]); map[orig]=dk; });
  let ans=null; if(q.answer) ans=q.answer.map(a=>map[a]).filter(Boolean).sort().join('');
  return [display,ans];
}
function renderQuestion() {
  if(state.idx>=state.pool.length) { renderResult(); return; }
  const q=state.pool[state.idx]; state.current=q; [state.displayOptions,state.displayAnswer]=buildDisplay(q); state.answered=false;
  const answerTag=state.displayAnswer?'有答案，可判分':'未录入答案，不判分';
  $('qMeta').textContent=`第 ${state.idx+1}/${state.pool.length} 题｜${q.chapter} 原第${q.number}题｜${q.type}｜${answerTag}`;
  $('bar').style.width=`${((state.idx)/Math.max(1,state.pool.length))*100}%`;
  $('stem').textContent=q.stem;
  const isSingle=q.type.includes('单选'); const opts=$('options'); opts.innerHTML='';
  state.displayOptions.forEach(([dk,orig,text])=>{ const label=document.createElement('label'); label.className='option';
    label.innerHTML=`<input name="answer" type="${isSingle?'radio':'checkbox'}" value="${dk}"><span><b>${dk}.</b> ${escapeHtml(text)}</span>`;
    label.addEventListener('click',()=>setTimeout(updateSelectedStyles,0)); opts.appendChild(label);
  });
  $('feedback').className='feedback'; $('feedback').textContent='选择答案后点击提交；多选题可选择多个。'; $('submitBtn').textContent='提交答案';
}
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function getAnswer() { return [...document.querySelectorAll('input[name="answer"]:checked')].map(el=>el.value).sort().join(''); }
function updateSelectedStyles() { document.querySelectorAll('.option').forEach(el=>{ const input=el.querySelector('input'); el.classList.toggle('selected', input.checked); }); }
function disableOptions() { document.querySelectorAll('input[name="answer"]').forEach(el=>el.disabled=true); }
function submitOrNext() { if(state.answered) { state.idx++; renderQuestion(); return; } submitAnswer(); }
function submitAnswer() {
  const q=state.current; const user=getAnswer(); const ans=state.displayAnswer; state.answered=true; disableOptions(); $('submitBtn').textContent='下一题';
  if(!ans) { if(user) {state.noAnswerAnswered++; setFeedback(`该题暂未录入答案，已记录你的选择：${user}。`, 'warn');} else {state.noAnswerSkipped++; setFeedback('该题暂未录入答案，你已跳过。', 'warn');} return; }
  state.totalKnown++;
  if(!user) { state.skippedKnown++; state.wrongRecords.push(makeRecord('未作答',ans)); setFeedback(`已跳过。本题正确答案：${ans}。`, 'warn'); return; }
  state.answeredKnown++;
  if(user===ans) { state.correct++; setFeedback(`正确。本题答案：${ans}。`, 'good'); }
  else { state.wrongRecords.push(makeRecord(user,ans)); setFeedback(`错误。你的答案：${user}；正确答案：${ans}。`, 'bad'); }
}
function setFeedback(text,type) { const f=$('feedback'); f.textContent=text+' 点击“下一题”继续。'; f.className='feedback '+type; }
function makeRecord(user,right) { const q=state.current; return {chapter:q.chapter,number:q.number,type:q.type,stem:q.stem,options:state.displayOptions.slice(),user,right}; }
function skipQuestion() {
  if(state.answered) { state.idx++; renderQuestion(); return; }
  const ans=state.displayAnswer; if(ans) { state.totalKnown++; state.skippedKnown++; state.wrongRecords.push(makeRecord('未作答',ans)); } else state.noAnswerSkipped++;
  state.idx++; renderQuestion();
}
function renderResult() {
  $('bar').style.width='100%'; show('resultView');
  const rate=state.totalKnown ? `${state.correct}/${state.totalKnown} = ${(state.correct/state.totalKnown*100).toFixed(1)}%` : '暂无';
  $('resultStats').innerHTML=`
    <div class="stat">本轮出题<b>${state.pool.length}</b></div>
    <div class="stat">答对题数<b>${state.correct}</b></div>
    <div class="stat">有答案题正确率<b>${rate}</b></div>
    <div class="stat">无答案题已作答<b>${state.noAnswerAnswered}</b></div>`;
  if(!state.wrongRecords.length) { $('reviewText').textContent='本轮没有错题或跳过的有答案题。'; return; }
  let txt=''; state.wrongRecords.forEach((r,i)=>{
    txt += `${i+1}. ${r.chapter} 原第${r.number}题｜${r.type}
${r.stem}
`;
    r.options.forEach(([dk,orig,t])=>{ txt += `${dk}. ${t}
`; });
    txt += `你的答案：${r.user}；正确答案：${r.right}
${'-'.repeat(38)}
`;
  }); $('reviewText').textContent=txt;
}
function goHome() { show('startView'); }

$('selectAllBtn').onclick=()=>document.querySelectorAll('.chBox').forEach(x=>x.checked=true);
$('clearBtn').onclick=()=>document.querySelectorAll('.chBox').forEach(x=>x.checked=false);
$('introBtn').onclick=()=>document.querySelectorAll('.chBox').forEach((x,i)=>x.checked=(i===0));
$('startBtn').onclick=startQuiz; $('submitBtn').onclick=submitOrNext; $('skipBtn').onclick=skipQuestion; $('finishBtn').onclick=renderResult; $('againBtn').onclick=goHome; $('homeBtn').onclick=goHome;
renderChapters();
</script>
</body>
</html>
